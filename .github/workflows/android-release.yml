name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      from_version:
        description: First version to publish (X.Y.Z)
        type: string
      to_version:
        description: Last version to publish (defaults to the current version)
        type: string

concurrency:
  group: zhiyu-android-release
  # A pending version bump must still run if another push arrives.
  queue: max

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select versions to publish
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FROM_VERSION: ${{ inputs.from_version }}
          TO_VERSION: ${{ inputs.to_version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/android_release.py plan
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.plan.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK tools
        if: steps.plan.outputs.ready == 'true'
        run: |
          sdk_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$sdk_bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
          printf '%s\n' "$sdk_bin" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Test and build the release APKs
        if: steps.plan.outputs.ready == 'true'
        env:
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_OAUTH_CLIENT_SECRET }}
        run: |
          test -n "$ANTIGRAVITY_OAUTH_CLIENT_ID" && test -n "$ANTIGRAVITY_OAUTH_CLIENT_SECRET"
          python3 .github/scripts/android_release.py build
      - name: Sign release APKs and verify their certificates and versions
        if: steps.plan.outputs.ready == 'true'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: python3 .github/scripts/android_release.py sign
      - name: Download published upgrade baseline
        if: steps.plan.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.1 --pattern Zhiyu-0.1.1.apk --dir "$RUNNER_TEMP/zhiyu-release"
      - name: Verify upgrades on Android
        if: steps.plan.outputs.ready == 'true'
        run: |
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager --install "$image"
          avd_name=zhiyu-upgrade
          export ANDROID_AVD_HOME="$RUNNER_TEMP/zhiyu-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name "$avd_name" --package "$image" <<< no
          emulator="$ANDROID_HOME/emulator/emulator"
          "$emulator" -list-avds | grep -Fx "$avd_name"
          sudo chmod a+rw /dev/kvm
          "$emulator" -avd "$avd_name" -port 5554 -accel on \
            -no-window -no-snapshot -no-audio -gpu swiftshader \
            > "$RUNNER_TEMP/zhiyu-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 360 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do
            kill -0 "$1" 2>/dev/null || exit 1
            sleep 2
          done' _ "$emulator_pid"; then
            cat "$RUNNER_TEMP/zhiyu-emulator.log"
            exit 1
          fi
          python3 .github/scripts/android_release.py verify-upgrade
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.ready == 'true'
        with:
          name: signed-apks
          path: ${{ runner.temp }}/zhiyu-release/signed
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apks
          path: ${{ runner.temp }}/zhiyu-release/signed
      - name: Publish verified APKs in version order
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/android_release.py publish
